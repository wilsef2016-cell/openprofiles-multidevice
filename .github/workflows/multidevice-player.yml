name: Instalar player automático MultiDevice (teste)

on:
  push:
    branches: [multidevice-test]
    paths:
      - .github/workflows/multidevice-player.yml

permissions:
  contents: write

jobs:
  instalar:
    if: github.ref == 'refs/heads/multidevice-test'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código da branch de teste
        uses: actions/checkout@v4
        with:
          ref: multidevice-test
          persist-credentials: true
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Gerar arquivos do player experimental
        shell: bash
        run: |
          set -euo pipefail
          test -f src/web/device-pairing.js
          mkdir -p src/web scripts test
          cat > src/web/device-player-page.js <<'MULTIDEVICE_src_web_device-player-page_js'
          import { esc } from './device-core.js';

          /** HTML devolvido apenas para navegadores com pareamento válido. */
          export function renderDevicePlayer(device) {
            return `<p><a href="/devices/me">Voltar ao aparelho</a> · <a href="/devices/history.json">Histórico em JSON</a></p>
              <p><strong>Aparelho:</strong> ${esc(device.label)} · <strong>Perfil:</strong> ${esc(device.profile_name)}</p>
              <p>Este player experimental salva o progresso automaticamente no perfil pareado. Ele <strong>não é o player nativo do Stremio</strong>.</p>
              <form id="player-form" autocomplete="off">
                <p><label>Tipo <select id="media-type"><option value="movie">Filme</option><option value="series">Série</option></select></label></p>
                <p><label>ID IMDb da obra <input id="media-id" required placeholder="tt0133093" pattern="tt[0-9]{5,12}" maxlength="14"></label></p>
                <p><label>ID do vídeo/episódio <input id="video-id" placeholder="Opcional para filme; obrigatório para episódio" maxlength="120"></label></p>
                <p><label>Nome <input id="video-title" required maxlength="120" placeholder="Vídeo de teste"></label></p>
                <p><label>Link direto HTTPS MP4/WebM autorizado <input id="stream-url" type="url" inputmode="url" required placeholder="https://exemplo.com/video.mp4" style="width:min(100%,650px)"></label></p>
                <p><button type="submit">Carregar vídeo</button></p>
              </form>
              <p id="player-status" role="status" aria-live="polite">Informe um vídeo autorizado e clique em Carregar vídeo.</p>
              <video id="paired-video" controls playsinline preload="metadata" style="display:block;width:min(100%,780px);max-height:65vh;background:#111" aria-label="Player de teste"></video>
              <p id="saved-position"></p>
              <p><small>O link do vídeo não é salvo no nosso servidor. O navegador o carrega diretamente do endereço informado. O suporte ao formato depende do navegador e da origem do arquivo.</small></p>
              <script src="/devices/player-client.js" defer></script>`;
          }
          MULTIDEVICE_src_web_device-player-page_js
          cat > src/web/device-player-client.js <<'MULTIDEVICE_src_web_device-player-client_js'
          /* Player web experimental, executado somente no navegador já pareado. */
          (() => {
            'use strict';
            const $ = (id) => document.getElementById(id);
            const form = $('player-form');
            const video = $('paired-video');
            const status = $('player-status');
            const positionLabel = $('saved-position');
            const typeInput = $('media-type');
            const mediaInput = $('media-id');
            const episodeInput = $('video-id');
            const titleInput = $('video-title');
            const sourceInput = $('stream-url');
            let active = null;
            let lastPeriodicAt = 0;
            let sequence = Promise.resolve();
            let pendingResumeMs = 0;

            function setStatus(message) { status.textContent = message; }
            function formatTime(seconds) {
              const safe = Math.max(0, Math.round(Number(seconds) || 0));
              return `${Math.floor(safe / 60)}m ${String(safe % 60).padStart(2, '0')}s`;
            }
            function directHttpsUrl(value) {
              try {
                const url = new URL(value);
                if (url.protocol !== 'https:' || !url.hostname || url.username || url.password) return null;
                return url.href;
              } catch { return null; }
            }
            function currentPayload(action) {
              if (!active || !Number.isFinite(video.duration) || video.duration <= 0) return null;
              return {
                type: active.type,
                mediaId: active.mediaId,
                videoId: active.videoId,
                title: active.title,
                currentMs: Math.round(Math.min(Math.max(0, video.currentTime), video.duration) * 1000),
                durationMs: Math.round(video.duration * 1000),
                action,
              };
            }
            function send(action, keepalive = false) {
              const payload = currentPayload(action);
              if (!payload) return;
              // Serializa requisições para evitar que um evento antigo sobrescreva o último minuto.
              sequence = sequence.catch(() => {}).then(async () => {
                const response = await fetch('/devices/progress', {
                  method: 'POST',
                  credentials: 'same-origin',
                  headers: { 'Content-Type': 'application/json', 'X-Device-Client': '1' },
                  body: JSON.stringify(payload),
                  cache: 'no-store',
                  keepalive,
                });
                if (!response.ok) throw new Error(`Servidor retornou ${response.status}. Verifique o pareamento.`);
                if (!keepalive) setStatus(`Progresso salvo: ${formatTime(payload.currentMs / 1000)} (${action}).`);
              }).catch((error) => {
                if (!keepalive) setStatus(`Não foi possível salvar o progresso: ${error.message}`);
              });
            }
            async function savedFor(videoId) {
              const response = await fetch('/devices/history.json', { credentials: 'same-origin', cache: 'no-store' });
              if (!response.ok) throw new Error('Sessão de aparelho inválida. Abra /devices/activate.');
              const history = await response.json();
              return (history.items || []).find((entry) => entry.videoId === videoId) || null;
            }

            form.addEventListener('submit', async (event) => {
              event.preventDefault();
              const type = typeInput.value;
              const mediaId = mediaInput.value.trim();
              const episode = episodeInput.value.trim();
              const videoId = episode || mediaId;
              const title = titleInput.value.trim();
              const source = directHttpsUrl(sourceInput.value.trim());
              if (!/^tt\d{5,12}$/.test(mediaId) || !/^[A-Za-z0-9:_-]{3,120}$/.test(videoId) || !title || !source) {
                setStatus('Confira o ID IMDb, o nome, o ID do vídeo e o link HTTPS.');
                return;
              }
              if (type === 'series' && !episode) {
                setStatus('Para séries, preencha um ID de episódio diferente para cada episódio (ex.: tt1234567:1:1).');
                return;
              }
              try {
                setStatus('Consultando o histórico deste perfil...');
                const saved = await savedFor(videoId);
                video.pause();
                active = { type, mediaId, videoId, title };
                pendingResumeMs = saved && saved.action !== 'ended' ? Math.max(0, Number(saved.currentMs) || 0) : 0;
                positionLabel.textContent = saved
                  ? `Progresso anterior neste perfil: ${formatTime(saved.currentMs / 1000)}.`
                  : 'Nenhum progresso anterior para este vídeo.';
                lastPeriodicAt = 0;
                video.removeAttribute('src');
                video.load();
                video.src = source;
                video.load();
                setStatus('Vídeo carregando. Use Reproduzir para começar.');
              } catch (error) {
                setStatus(`Falha ao carregar o progresso: ${error.message}`);
              }
            });

            video.addEventListener('loadedmetadata', () => {
              if (!active) return;
              if (!Number.isFinite(video.duration) || video.duration <= 0) {
                setStatus('Este player só registra vídeos com duração conhecida.');
                return;
              }
              if (pendingResumeMs > 0) {
                const seconds = Math.min(pendingResumeMs / 1000, Math.max(0, video.duration - 0.25));
                try { video.currentTime = seconds; } catch { /* Alguns formatos não aceitam seek. */ }
                setStatus(`Progresso recuperado: ${formatTime(seconds)}. Pressione Reproduzir.`);
              } else {
                setStatus(`Vídeo pronto: ${formatTime(video.duration)}. Pressione Reproduzir.`);
              }
              pendingResumeMs = 0;
            });
            video.addEventListener('playing', () => { lastPeriodicAt = Date.now(); send('start'); });
            video.addEventListener('timeupdate', () => {
              if (!active || video.paused || video.ended || !Number.isFinite(video.duration)) return;
              if (Date.now() - lastPeriodicAt >= 15000) {
                lastPeriodicAt = Date.now();
                send('start');
              }
            });
            video.addEventListener('pause', () => {
              if (active && !video.ended) send('pause');
            });
            video.addEventListener('seeked', () => {
              if (active && !video.ended) send('pause');
            });
            video.addEventListener('ended', () => send('ended'));
            video.addEventListener('error', () => {
              setStatus('Não foi possível reproduzir o vídeo. Confira o link, o formato e as permissões do servidor de mídia.');
            });
            window.addEventListener('pagehide', () => {
              if (active && !video.ended) send('stop', true);
            });
          })();
          MULTIDEVICE_src_web_device-player-client_js
          cat > scripts/apply-player.mjs <<'MULTIDEVICE_scripts_apply-player_mjs'
          #!/usr/bin/env node
          import fs from 'node:fs';
          import path from 'node:path';

          // Rodar na raiz do fork. --check verifica sem escrever.
          const target = process.cwd();
          const check = process.argv.includes('--check');
          const file = path.join(target, 'src/web/device-pairing.js');
          if (!fs.existsSync(file)) throw new Error('src/web/device-pairing.js não encontrado: execute na raiz do fork correto.');
          for (const relative of ['src/web/device-player-page.js', 'src/web/device-player-client.js']) {
            if (!fs.existsSync(path.join(target, relative))) throw new Error(`Arquivo obrigatório ausente: ${relative}`);
          }
          let source = fs.readFileSync(file, 'utf8');
          const already = source.includes('MULTIDEVICE_PLAYER_V02');
          if (!already) {
            const imports = "import crypto from 'node:crypto';";
            const history = "  router.get('/history.json',requireDevice";
            const form = '      <h2>Atualização manual de teste</h2>';
            const oldDuration = '${Math.round(h.currentMs/60000)} de ${Math.round(h.durationMs/60000)} minutos';
            for (const [label, str] of [['imports',imports],['history',history],['form',form],['duration',oldDuration]]) {
              const count = source.split(str).length - 1;
              if (count !== 1) throw new Error(`O código mudou: âncora ${label} encontrada ${count} vezes; não alterei nada.`);
            }
            source = source.replace(imports,
              imports + "\nimport { fileURLToPath } from 'node:url';\nimport { renderDevicePlayer } from './device-player-page.js';");
            const routes = `  // MULTIDEVICE_PLAYER_V02: player web opcional; exige cookie de dispositivo pareado.\n` +
          `  router.get('/player',requireDevice,(req,res)=> {\n` +
          `    res.set('Content-Security-Policy', "default-src 'self'; script-src 'self'; connect-src 'self'; media-src https: blob:; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'none'");\n` +
          `    page(res,'Player automático · MultiDevice',renderDevicePlayer(req.mpDevice));\n` +
          `  });\n` +
          `  router.get('/player-client.js',requireDevice,(req,res)=> {\n` +
          `    res.set('Cache-Control','no-store').type('application/javascript').sendFile(fileURLToPath(new URL('./device-player-client.js',import.meta.url)));\n` +
          `  });\n`;
            source = source.replace(history, routes + history);
            source = source.replace(form, '      <p><a href="/devices/player">Abrir player automático experimental</a></p>\n' + form);
            source = source.replace(oldDuration, "${h.durationMs<60000?Math.round(h.currentMs/1000)+' de '+Math.round(h.durationMs/1000)+' segundos':Math.round(h.currentMs/60000)+' de '+Math.round(h.durationMs/60000)+' minutos'}");
          }
          if (check) console.log(already ? 'Player já aplicado.' : 'Âncoras verificadas, patch compatível. Nenhum arquivo alterado.');
          else if (already) console.log('Player já aplicado; nenhuma alteração necessária.');
          else { fs.writeFileSync(file,source); console.log('Player instalado: /devices/player, preservando as rotas existentes.'); }
          MULTIDEVICE_scripts_apply-player_mjs
          cat > test/device-player.test.mjs <<'MULTIDEVICE_test_device-player_test_mjs'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { renderDevicePlayer } from '../src/web/device-player-page.js';

          test('a página do player escapa nomes recebidos do banco', () => {
            const html = renderDevicePlayer({ label: '<img onerror=alert(1)>', profile_name: '<script>alert(1)</script>' });
            assert.doesNotMatch(html, /<script>alert\(1\)<\/script>/);
            assert.match(html, /&lt;script&gt;/);
            assert.match(html, /&lt;img/);
          });
          test('o formulário tem os IDs exigidos pelo player e não injeta URL no HTML', () => {
            const html = renderDevicePlayer({ label: 'Celular', profile_name: 'Original' });
            for (const id of ['player-form','paired-video','media-type','media-id','video-id','video-title','stream-url','player-status']) {
              assert.ok(html.includes(`id="${id}"`), `Faltou ${id}`);
            }
            assert.match(html, /src="\/devices\/player-client.js"/);
          });
          MULTIDEVICE_test_device-player_test_mjs
      - name: Conferir compatibilidade sem alterar
        run: node scripts/apply-player.mjs --check
      - name: Aplicar player experimental
        run: node scripts/apply-player.mjs
      - name: Verificar sintaxe e alterações
        shell: bash
        run: |
          set -euo pipefail
          node --check src/web/device-pairing.js
          node --check src/web/device-player-client.js
          node --check src/web/device-player-page.js
          node --check scripts/apply-player.mjs
          git diff --check
      - name: Executar testes do novo player
        run: node --test test/device-player.test.mjs
      - name: Executar testes do OpenProfiles original
        run: |
          npm ci
          npm test
      - name: Salvar apenas arquivos esperados na branch de teste
        shell: bash
        run: |
          set -euo pipefail
          git add -- src/web/device-pairing.js src/web/device-player-page.js src/web/device-player-client.js scripts/apply-player.mjs test/device-player.test.mjs
          while IFS= read -r file; do
            case "$file" in
              src/web/device-pairing.js|src/web/device-player-page.js|src/web/device-player-client.js|scripts/apply-player.mjs|test/device-player.test.mjs) ;;
              *) echo "Arquivo inesperado: $file"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          test -n "$(git diff --cached --name-only)" || { echo 'Nenhum arquivo mudou, nada a publicar.'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add paired web player with automatic per-profile progress [test]'
          git push origin HEAD:multidevice-test
