      - name: Conferir compatibilidade antes de alterar codigo
        run: node scripts/apply-bridge.mjs --check
      - name: Aplicar ponte automatica
        run: node scripts/apply-bridge.mjs
      - name: Verificar sintaxe e executar testes da ponte
        shell: bash
        run: |
          set -euo pipefail
          node --check src/web/device-bridge-core.js
          node --check src/web/device-network-bridge.js
          node --check src/web/device-pairing.js
          node --check src/web/device-tracking.js
          node --test test/device-bridge.test.mjs
      - name: Executar testes existentes do projeto
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
      - name: Salvar alteracoes apenas na branch multidevice-test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web/device-bridge-core.js src/web/device-network-bridge.js src/web/device-pairing.js src/web/device-tracking.js scripts/apply-bridge.mjs test/device-bridge.test.mjs
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nova para salvar"
          else
            git commit -m "Add experimental automatic browser-network matching for native tracking"
            git push origin HEAD:multidevice-test
          fi
