name: Instalar ponte automatica MultiDevice v0.4 (diagnostico)

on:
  push:
    branches: [multidevice-test]
    paths: [.github/workflows/multidevice-bridge.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    name: Aplicar e testar ponte automatica em multidevice-test
    if: github.ref == 'refs/heads/multidevice-test'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar somente branch de teste
        uses: actions/checkout@v4
        with:
          ref: multidevice-test
          persist-credentials: true
          fetch-depth: 0
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirmar base e branch existentes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = multidevice-test
          test -f src/web/device-tracking.js
          test -f src/web/device-pairing.js
          grep -q 'MULTIDEVICE_TRACKING_V03' src/web/device-pairing.js
